app = "easy-books-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# NOTE: APP_ENV is deliberately NOT set to "production".
# backend/db.py raises RuntimeError when APP_ENV=production and DATABASE_URL
# is unset. This deploy uses the SQLite fallback on the Fly volume below,
# so the env stays at its "development" default to keep that path open.
[env]
  EB_DATA_DIR = "/data"
  STORAGE_BACKEND = "local"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/version"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# SQLite lives here. Single machine only — do not scale this app past 1.
[[mounts]]
  source = "easy_books_data"
  destination = "/data"
