upstream api { server backend:8000; }
upstream ui  { server frontend:3000; }

server {
    listen 80;
    server_name _;

    # Allow larger payloads for logo uploads and attachment files
    client_max_body_size 20M;

    # FastAPI — all /api/* routes and uploaded files
    location /api/ {
        proxy_pass            http://api;
        proxy_http_version    1.1;
        proxy_set_header      Host               $host;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto  $scheme;
        proxy_set_header      Connection         "";
        # WeasyPrint PDF generation can take a few seconds on complex reports
        proxy_read_timeout    120s;
    }

    location /uploads/ {
        proxy_pass            http://api;
        proxy_http_version    1.1;
        proxy_set_header      Connection         "";
    }

    # Next.js — everything else
    location / {
        proxy_pass            http://ui;
        proxy_http_version    1.1;
        proxy_set_header      Host               $host;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      Upgrade            $http_upgrade;
        proxy_set_header      Connection         "upgrade";
        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    60s;
    }
}
