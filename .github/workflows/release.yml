# ─────────────────────────────────────────────────────────────────────────────
# Easy-Books — Deterministic release pipeline
#
# Trigger:  git tag vX.Y.Z  →  git push origin vX.Y.Z
#
# ── HOW TO CUT A RELEASE ────────────────────────────────────────────────────
# 1. Bump ALL THREE version files to the new version (e.g. 2.9.0):
#      frontend/package.json       → "version": "2.9.0"
#      desktop/package.json        → "version": "2.9.0"
#      backend/pyproject.toml      → version = "2.9.0"
# 2. Commit:  git commit -am "chore: bump version to 2.9.0"
# 3. Tag:     git tag v2.9.0
# 4. Push:    git push origin main v2.9.0
#
# The validate job enforces that all three files match the tag — the pipeline
# fails fast if any file is out of sync. Script-install users' UpdateModal
# compares their running version against the GitHub Release tag created here.
# ─────────────────────────────────────────────────────────────────────────────
#
# Stages:
#   1. validate  — fail fast if tag ≠ desktop/package.json ≠ frontend/package.json
#                  ≠ backend/pyproject.toml (all 3 must match the pushed tag)
#   2. build     — Windows (always) + macOS (only when APPLE_ID secret is set)
#                  Both run `--publish never` to produce local artifacts only.
#   3. publish   — single job creates/updates the GitHub Release and uploads
#                  all artifacts. Single writer avoids latest.yml race.
#
# Secrets required (set in repo Settings → Secrets → Actions):
#   GITHUB_TOKEN          — auto-provided by Actions (needs `contents: write`)
#   CSC_LINK              — base64-encoded .p12 code-signing cert (optional; skip = unsigned)
#   CSC_KEY_PASSWORD      — cert password (optional)
#   APPLE_ID              — notarization email — if ABSENT, macOS build is skipped entirely
#   APPLE_APP_SPECIFIC_PASSWORD
#   APPLE_TEAM_ID
#
# macOS note:
#   electron-builder.yml has `notarize: true` + `hardenedRuntime: true`.
#   Without the Apple secrets the macOS job is skipped rather than failing —
#   a Windows-only release is published automatically. Set all three Apple
#   secrets to enable signed + notarized macOS DMGs.
#
# Pre-release detection:
#   Tags containing a hyphen (v2.9.0-beta.1, v3.0.0-rc.2) are published as
#   GitHub pre-releases automatically.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.8.0) — must already exist in the repo"
        required: true

permissions:
  contents: write

# ── Stage 1: Validate ─────────────────────────────────────────────────────────
jobs:
  validate:
    name: Validate versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vtag.outputs.version }}
      is_prerelease: ${{ steps.vtag.outputs.is_prerelease }}
      macos_enabled: ${{ steps.check_apple.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - id: vtag
        name: Extract version from tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG:  ${{ github.event.inputs.tag }}
        run: |
          # Support both automatic tag push and manual workflow_dispatch.
          # Values come from env vars (not inline expressions) to prevent
          # shell injection from attacker-controlled input.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REF="$INPUT_TAG"
          else
            REF="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Pre-release if the version contains a hyphen (e.g. 2.9.0-beta.1)
          if echo "$VERSION" | grep -q '-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Tag: ${REF}  →  version: ${VERSION}"

      - name: Verify frontend/package.json matches tag
        env:
          EXPECTED: ${{ steps.vtag.outputs.version }}
        run: |
          pkg=$(node -p "require('./frontend/package.json').version")
          if [ "$pkg" != "$EXPECTED" ]; then
            echo "::error file=frontend/package.json::version '$pkg' does not match tag 'v$EXPECTED' — bump frontend/package.json before tagging"
            exit 1
          fi
          echo "✅  frontend/package.json: $pkg"

      - name: Verify desktop/package.json matches tag
        env:
          EXPECTED: ${{ steps.vtag.outputs.version }}
        run: |
          pkg=$(node -p "require('./desktop/package.json').version")
          if [ "$pkg" != "$EXPECTED" ]; then
            echo "::error file=desktop/package.json::version '$pkg' does not match tag 'v$EXPECTED' — bump desktop/package.json before tagging"
            exit 1
          fi
          echo "✅  desktop/package.json: $pkg"

      - name: Verify backend/pyproject.toml matches tag
        env:
          EXPECTED: ${{ steps.vtag.outputs.version }}
        run: |
          pkg=$(python3 -c "import re; t=open('backend/pyproject.toml').read(); print(re.search(r'version\s*=\s*\"([^\"]+)\"', t).group(1))")
          if [ "$pkg" != "$EXPECTED" ]; then
            echo "::error file=backend/pyproject.toml::version '$pkg' does not match tag 'v$EXPECTED' — bump backend/pyproject.toml before tagging"
            exit 1
          fi
          echo "✅  backend/pyproject.toml: $pkg"

      - id: check_apple
        name: Check whether Apple secrets are available
        # Secrets cannot be read in `if:` conditions directly, but they can be
        # tested in a run step and emitted as an output.
        run: |
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅  Apple secrets present — macOS build will run"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  APPLE_ID secret not set — macOS build will be skipped (Windows-only release)"
          fi

# ── Stage 2a: Build — Windows (always) ────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync backend Python environment
        working-directory: backend
        run: uv sync

      - name: Stage desktop resources (PyInstaller + Next.js + portable Node)
        run: pwsh -File desktop/scripts/prepare-resources.ps1

      - name: Install desktop (Electron) dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 1

# ── Stage 2b: Build — macOS (only when Apple secrets are present) ─────────────
  build-macos:
    name: Build (macOS)
    needs: validate
    if: needs.validate.outputs.macos_enabled == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync backend Python environment
        working-directory: backend
        run: uv sync

      - name: Stage desktop resources (PyInstaller + Next.js + portable Node)
        run: bash desktop/scripts/prepare-resources.sh

      - name: Install desktop (Electron) dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS installer
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.dmg.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

# ── Stage 2b: Mobile signed-build scaffolding (#307) ──────────────────────────
# Does NOT fail the Electron release when store signing secrets are absent.
  mobile-android:
    name: Mobile Android AAB (optional signing)
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Capacitor sync + optional signed bundle
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci-signed-build.sh
      - name: Upload AAB if produced
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14

# ── Stage 3: Publish (single job — no race on latest.yml) ─────────────────────
  publish:
    name: Publish GitHub release
    # Wait for Windows (always required). macOS is optional — `always()` lets
    # this job proceed even when build-macos was skipped or absent.
    needs: [validate, build-windows, build-macos]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: release-assets

      - name: Download macOS artifacts (if built)
        uses: actions/download-artifact@v4
        if: needs.build-macos.result == 'success'
        with:
          name: dist-macos
          path: release-assets

      - name: List assets to be published
        run: ls -lh release-assets/

      - name: Create GitHub release and upload all assets
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          VERSION:    ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          echo "Publishing Easy-Books v${VERSION} (pre-release: ${PRERELEASE})"

          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Create the release (fails if it already exists — intentional: don't
          # silently overwrite a release that may already have been downloaded).
          gh release create "v${VERSION}" release-assets/* \
            --title "Easy-Books v${VERSION}" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE_FLAG
