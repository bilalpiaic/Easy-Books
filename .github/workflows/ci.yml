# Lightweight CI on every PR / push — complements deploy.yml (main-only image build)
# and e2e.yml (Playwright). Uses uv for the backend (same as the rest of the repo).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install + test
        working-directory: backend
        env:
          OVERDUE_SWEEP_ENABLED: "false"
          WEBHOOKS_ENABLED: "false"
          # Flat backend package layout (db.py, models.py, …) — matches e2e.yml seed step.
          PYTHONPATH: .
        run: |
          uv sync
          uv run pytest -q --tb=line

  backend-postgres:
    name: Backend (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: easybooks_test
          # CI-only, no credential: GitGuardian flags POSTGRES_PASSWORD as a
          # generic secret even when the value is the docker default.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Marketplace / Studio / entitlements on Postgres
        working-directory: backend
        env:
          OVERDUE_SWEEP_ENABLED: "false"
          WEBHOOKS_ENABLED: "false"
          PYTHONPATH: .
          PYTEST_POSTGRES: "1"
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/easybooks_test?sslmode=disable
        run: |
          uv sync
          uv run pytest tests/test_marketplace.py tests/test_module_entitlements.py tests/test_studio_bundle.py tests/test_custom_fields.py tests/test_form_schema.py -q --tb=line

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
