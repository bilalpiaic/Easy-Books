# Deploy to VPS on push to main (#116).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/bilalpiaic/easy-books-backend
  IMAGE_FRONTEND: ghcr.io/bilalpiaic/easy-books-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        env:
          # Full suite uses the in-memory SQLite fixture (tests/conftest.py).
          # Leave DATABASE_URL unset: a Postgres URL builds db.engine at import,
          # which the fixture then replaces, and previously failed the SQLite
          # backup tests. Postgres coverage is the CI backend-postgres job.
          OVERDUE_SWEEP_ENABLED: "false"
          WEBHOOKS_ENABLED: "false"
          PYTHONPATH: .
        run: |
          uv sync
          uv run pytest -q --tb=line
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Set repository variable DEPLOY_ENABLED=true and secrets DEPLOY_HOST /
    # DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH to enable VPS deploys.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            export TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
